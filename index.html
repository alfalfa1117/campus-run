<link rel="apple-touch-icon" id="appleIcon" href="data:,">
<script>
/* ===== PWA: 动态生成 manifest 与图标 ===== */
(function () {
  function makeIcon(size, padding) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    var ctx = c.getContext('2d');
    var grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, '#FFFBF3');
    grad.addColorStop(1, '#F5E3C4');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, size, size);
    var cx = size / 2, cy = size / 2 + size * 0.04;
    var scale = 1 - (padding || 0);
    ctx.fillStyle = '#E8913F';
    ctx.beginPath();
    ctx.ellipse(cx, cy + size * 0.09 * scale, size * 0.20 * scale, size * 0.16 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    var toes = [
      { x: -0.21, y: -0.17, r: 0.078 },
      { x: -0.07, y: -0.25, r: 0.082 },
      { x: 0.07, y: -0.25, r: 0.082 },
      { x: 0.21, y: -0.17, r: 0.078 }
    ];
    toes.forEach(function (t) {
      ctx.beginPath();
      ctx.ellipse(
        cx + size * t.x * scale,
        cy + size * t.y * scale,
        size * t.r * scale,
        size * t.r * 1.05 * scale,
        0, 0, Math.PI * 2
      );
      ctx.fill();
    });
    return c.toDataURL('image/png');
  }

  try {
    var icon192 = makeIcon(192, 0.14);
    var icon512 = makeIcon(512, 0.14);
    var icon180 = makeIcon(180, 0.14);

    var manifest = {
      name: '21天校园跑 · 毛孩子陪伴计划',
      short_name: '校园跑',
      description: '21天校园跑打卡，养成你的3D小宠物',
      start_url: './',
      scope: './',
      display: 'standalone',
      orientation: 'portrait',
      background_color: '#FFFBF3',
      theme_color: '#F2A65A',
      lang: 'zh-CN',
      categories: ['health', 'fitness', 'lifestyle'],
      icons: [
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'any' },
        { src: icon192, sizes: '192x192', type: 'image/png', purpose: 'maskable' },
        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };

    var blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    var url = URL.createObjectURL(blob);

    function attach() {
      var link = document.getElementById('manifestLink');
      if (link) link.href = url;
      var apple = document.getElementById('appleIcon');
      if (apple) apple.href = icon180;
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', attach);
    } else {
      attach();
    }
  } catch (e) {
    console.warn('PWA 图标生成失败', e);
  }
})();
</script>
